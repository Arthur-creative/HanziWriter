<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字筆順學習大挑戰網頁</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hanzi Writer CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Playful font & LXGW WenKai TC (霞鶩文楷繁體) -->
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Mochiyom+Pop+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Tone.js for Web Audio SFX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config (專屬專案連線金鑰)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hanzi-learning-e565b';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyArTnvG8A4VEvS7pYVADs5AjjdY9bgDP-w",
            authDomain: "hanzi-learning-e565b.firebaseapp.com",
            databaseURL: "https://hanzi-learning-e565b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hanzi-learning-e565b",
            storageBucket: "hanzi-learning-e565b.firebasestorage.app",
            messagingSenderId: "1047703301489",
            appId: "1:1047703301489:web:c463968c8edc3aaf6f5ad0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        window.db = db;
        window.auth = auth;
        window.appId = appId;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.arrayUnion = arrayUnion;
        window.collection = collection;
        window.onSnapshot = onSnapshot;

        // 初始化登入狀態
        window.initAuth = async function() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }
            } catch(e) {
                console.warn("Auth initialization fallback:", e);
                if (window.loadCloudWordBanks) window.loadCloudWordBanks();
            }
        };

        // Google 帳號一鍵登入
        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.warn("Google 登入錯誤:", error);
                if (window.showAuthNotice) {
                    window.showAuthNotice("⚠️ Google 登入未完成，請聯絡管理員取得登入授權。");
                }
            }
        };

        // 登出並切回訪客匿名模式
        window.logoutGoogle = async function() {
            try {
                await signOut(auth);
                if (window.resetLocalUserVault) window.resetLocalUserVault();
                await signInAnonymously(auth);
            } catch (error) {
                console.warn("登出錯誤:", error);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                if (window.onUserLogin) window.onUserLogin(user);
            }
        });
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'child-yellow': '#ffde59',
                        'child-pink': '#FF4aba',
                        'child-blue': '#415acc',
                        'child-green': '#1bd2b2',
                        'child-orange': '#fdaa3a',
                        'grid-red': '#E53E3E',
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        fun: ['Mochiyom Pop One', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F8F9FA;
            background-image: radial-gradient(#E2E8F0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 米字格背景 CSS */
        .mi-zi-ge {
            position: relative;
            background-color: #FAF6EE;
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
                radial-gradient(rgba(180, 150, 100, 0.04) 1px, transparent 1px);
            background-size: 8px 8px, 12px 12px;
            border: 4px solid #E53E3E;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(229, 62, 62, 0.2), 0 8px 10px -6px rgba(229, 62, 62, 0.2);
        }

        .mi-zi-ge::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(to right, transparent calc(50% - 1px), rgba(229, 62, 62, 0.4) 50%, transparent calc(50% + 1px)),
                linear-gradient(to bottom, transparent calc(50% - 1px), rgba(229, 62, 62, 0.4) 50%, transparent calc(50% + 1px)),
                linear-gradient(45deg, transparent calc(50% - 0.5px), rgba(229, 62, 62, 0.25) 50%, transparent calc(50% + 0.5px)),
                linear-gradient(-45deg, transparent calc(50% - 0.5px), rgba(229, 62, 62, 0.25) 50%, transparent calc(50% + 0.5px));
            pointer-events: none;
            border-radius: 1.2rem;
        }

        #character-target svg {
            display: block;
            margin: auto;
        }

        #user-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            touch-action: none;
            border-radius: 1.2rem;
        }

        .btn-3d {
            transition: all 0.08s ease;
            box-shadow: 0 4px 0 0 #cbd5e1;
        }
        .btn-3d:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 0 0 #94a3b8;
        }
        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 #94a3b8;
        }

        @keyframes gridBlinkOnce {
            0%, 100% {
                background-color: #FAF6EE;
                box-shadow: 0 10px 25px -5px rgba(229, 62, 62, 0.2), 0 8px 10px -6px rgba(229, 62, 62, 0.2);
            }
            50% {
                background-color: #FECACA;
                box-shadow: 0 0 28px 6px rgba(229, 62, 62, 0.65);
            }
        }

        .grid-blink-once {
            animation: gridBlinkOnce 0.6s ease-in-out 1;
        }

        /* 字庫專用：第 1 款 LXGW WenKai TC（霞鶩文楷繁體）加粗毛筆風格 */
        .vault-brush-font {
            font-family: 'LXGW WenKai TC', 'BiauKai', 'DFKai-SB', '標楷體', serif;
            font-weight: 700;
            -webkit-text-stroke: 0.75px currentColor;
            line-height: 1.1;
        }

        .confetti-particle {
            position: absolute;
            pointer-events: none;
            z-index: 30;
            border-radius: 2px;
            animation: confettiFall 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes confettiFall {
            0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.4); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-start p-2 sm:p-4 font-sans max-w-2xl mx-auto">

    <!-- 頂部用戶帳號與分頁導覽 -->
    <header class="w-full text-center mb-2 shrink-0">
        <div class="flex items-center justify-between bg-white px-3 sm:px-4 py-1.5 rounded-2xl shadow-md border border-slate-200 mb-2 gap-2">
            <h1 class="text-xs sm:text-sm font-black text-child-black tracking-wide flex items-center gap-1.5 truncate">
                專為兒童學習漢字筆順而設計 
            </h1>
            <div id="user-info" class="flex items-center gap-1.5 shrink-0">
                <span id="user-display" class="text-xs font-bold bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full border border-slate-200 flex items-center gap-1">
                    👤 訪客模式
                </span>
                <button id="btn-google-login" onclick="loginWithGoogle()" class="btn-3d bg-white hover:bg-blue-50 text-slate-800 border border-slate-300 text-xs font-black px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm">
                    <i class="fa-brands fa-google text-red-500"></i> 登入
                </button>
                <button id="btn-google-logout" onclick="logoutGoogle()" class="hidden btn-3d bg-slate-200 hover:bg-slate-300 text-slate-700 border border-slate-300 text-xs font-black px-2.5 py-1 rounded-full">
                    登出
                </button>
            </div>
        </div>

        <!-- 登入提示訊息橫幅 (預設隱藏) -->
        <div id="auth-notice-banner" class="hidden w-full bg-amber-100 border border-amber-400 text-amber-900 text-xs font-bold px-3 py-1.5 rounded-xl mb-2 flex items-center justify-between">
            <span id="auth-notice-text"></span>
            <button onclick="document.getElementById('auth-notice-banner').classList.add('hidden')" class="ml-2 text-amber-800 font-black">✕</button>
        </div>

        <!-- 四大主分頁選單按鈕 -->
        <nav class="grid grid-cols-4 gap-1.5 sm:gap-2.5">
            <button onclick="switchTab('tab-practice')" id="nav-practice" 
                class="tab-btn btn-3d py-3 px-1 rounded-xl font-black text-sm sm:text-base bg-child-blue text-white border border-blue-600 flex items-center justify-center gap-1">
                <span>✏️</span> 練習
            </button>
            <button onclick="switchTab('tab-challenge')" id="nav-challenge" 
                class="tab-btn btn-3d py-3 px-1 rounded-xl font-black text-sm sm:text-base bg-slate-100 text-slate-700 border border-slate-300 flex items-center justify-center gap-1">
                <span>🎯</span> 挑戰
            </button>
            <button onclick="switchTab('tab-competition')" id="nav-competition" 
                class="tab-btn btn-3d py-3 px-1 rounded-xl font-black text-sm sm:text-base bg-slate-100 text-slate-700 border border-slate-300 flex items-center justify-center gap-1">
                <span>⚔️</span> 競賽
            </button>
            <button onclick="switchTab('tab-vault')" id="nav-vault" 
                class="tab-btn btn-3d py-3 px-1 rounded-xl font-black text-sm sm:text-base bg-slate-100 text-slate-700 border border-slate-300 flex items-center justify-center gap-1">
                <span>📖</span> 字庫
            </button>
        </nav>
    </header>

    <!-- 1 & 2. 筆順練習 / 筆順挑戰 主要區域 -->
    <main id="main-learning-view" class="w-full bg-white p-1 sm:p-1 rounded-3xl shadow-xl border-3 border-slate-100 flex flex-col items-center justify-center mb-auto gap-3">
        
        <!-- 輸入欄與功能區 (垂直置中排版) -->
        <div class="w-full flex items-center justify-center gap-2.5 p-2 bg-slate-50 rounded-2xl border border-slate-200">
            <div class="flex-1 max-w-[200px]">
                <input type="text" id="char-input" maxlength="1" placeholder="點擊輸入漢字" 
                    class="w-full text-center text-2xl font-black border-2 border-child-blue rounded-xl p-1 bg-blue-50/30 text-child-blue focus:outline-none focus:ring-2 focus:ring-child-blue shadow-inner h-11"
                    oninput="handleInputChar(this.value)">
            </div>

            <div class="flex gap-1 shrink-0">
                <button onclick="clearAllContent()" title="清除"
                    class="btn-3d bg-child-green text-slate-900 font-black px-4 py-2 h-11 rounded-xl border border-teal-600 text-sm sm:text-base flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-trash-can text-base sm:text-lg"></i>清除
                </button>
            </div>
        </div>

        <!-- 提示卡片 -->
        <div id="feedback-card" class="w-full bg-blue-100 border-2 border-child-blue/40 rounded-xl py-1 px-4 text-center shadow-sm">
            <p id="feedback-text" class="text-sm sm:text-base font-black text-child-blue tracking-wide">
                點擊「播放筆順」觀看漢字怎麼寫喔！
            </p>
        </div>

        <!-- 米字格畫布 (垂直置中) -->
        <div class="relative w-full max-w-[320px] sm:max-w-[360px] aspect-square flex items-center justify-center my-1">
            <div id="grid-container" class="mi-zi-ge w-full h-full relative overflow-hidden flex items-center justify-center">
                <div id="character-target" class="w-full h-full flex items-center justify-center"></div>
                <canvas id="user-canvas"></canvas>
            </div>
        </div>

        <!-- 按鈕群 (整合暫停/繼續至快寫與慢寫按鈕，均分為 3 個按鈕) -->
        <div id="control-buttons-group" class="w-full max-w-[360px] grid grid-cols-3 gap-2">
            <button id="btn-slow" onclick="toggleSpeedPlay(0.4)" 
                class="btn-3d bg-child-orange text-black font-black h-12 rounded-xl border border-sky-300 flex items-center justify-center gap-1.5 text-sm sm:text-base">
                <i id="icon-slow" class="fa-solid fa-play text-xl"></i> 跟寫
            </button>
            <button id="btn-fast" onclick="toggleSpeedPlay(1)" 
                class="btn-3d bg-child-orange text-black font-black h-12 rounded-xl border border-sky-300 flex items-center justify-center gap-1.5 text-sm sm:text-base">
                <i id="icon-fast" class="fa-solid fa-play text-xl"></i> 示範
            </button>
            <button id="btn-clear" onclick="clearUserCanvas()" 
                class="btn-3d bg-child-green text-black font-black h-12 rounded-xl border border-teal-600 flex items-center justify-center text-sm sm:text-base">
                清除筆跡
            </button>
        </div>

        <!-- 筆畫調整選單 (恢復單行佈局) -->
        <div id="settings-menu-group" class="w-full max-w-[360px] bg-slate-100 p-2.5 rounded-2xl border border-slate-200 flex items-center justify-between transition-all">
            <span class="text-sm font-black text-slate-700 shrink-0">筆畫調整:</span>
            
            <!-- 顏色選擇器 -->
            <div class="flex gap-1.5 items-center shrink-0" id="color-picker-group">
                <button onclick="setBrushColor('#2f7fff', this)" class="color-btn w-6 h-6 rounded-full bg-[#5271FF] border-2 border-white shadow-sm ring-2 ring-slate-900 transition-all"></button>
                <button onclick="setBrushColor('#e12626', this)" class="color-btn w-6 h-6 rounded-full bg-[#E53E3E] border-2 border-white shadow-sm transition-all"></button>
                <button onclick="setBrushColor('#fce11d', this)" class="color-btn w-6 h-6 rounded-full bg-[#FFDE59] border-2 border-white shadow-sm transition-all"></button>
                <button onclick="setBrushColor('#0ac7a6', this)" class="color-btn w-6 h-6 rounded-full bg-[#00C2CB] border-2 border-white shadow-sm transition-all"></button>
            </div>

            <!-- 三段粗細按鈕 (細、中、粗 線條示意圖) -->
            <div class="flex gap-1.5 items-center shrink-0" id="size-picker-group">
                <!-- 細 -->
                <button onclick="setBrushSize(6, this)" title="細筆畫" class="size-btn w-7 h-7 rounded-full bg-white border border-slate-300 flex items-center justify-center shadow-sm transition-all">
                    <div class="w-4 h-[2px] bg-slate-800 rounded-full"></div>
                </button>
                <!-- 中 (預設選取) -->
                <button onclick="setBrushSize(12, this)" title="中筆畫" class="size-btn w-7 h-7 rounded-full bg-white border border-slate-300 flex items-center justify-center shadow-sm ring-2 ring-slate-900 transition-all">
                    <div class="w-4 h-[4px] bg-slate-800 rounded-full"></div>
                </button>
                <!-- 粗 -->
                <button onclick="setBrushSize(20, this)" title="粗筆畫" class="size-btn w-7 h-7 rounded-full bg-white border border-slate-300 flex items-center justify-center shadow-sm transition-all">
                    <div class="w-4 h-[7px] bg-slate-800 rounded-full"></div>
                </button>
            </div>
        </div>
    </main>

    <!-- 3. 筆順競賽分頁 (隱藏狀態) -->
    <div id="tab-competition-view" class="hidden w-full bg-white p-3 sm:p-5 rounded-3xl shadow-xl border-3 border-slate-100 flex flex-col gap-4 mb-auto">
        <!-- 競賽首頁區塊 (包含橫幅、等級選擇、三欄英雄榜) -->
        <div id="comp-home-section" class="flex flex-col gap-4">
            <div class="bg-gradient-to-r from-orange-400 to-amber-500 p-3 rounded-2xl text-black text-center shadow-md">
                <h2 class="text-lg font-black tracking-wide">⚔️ 選擇等級來進行挑戰吧! ⚔️</h2>
                <p class="text-sm mt-1 opacity-95">※累計三次錯誤後比賽結束_登入Google帳號可保留最佳成績※</p>
            </div>

            <!-- 等級選擇器 -->
            <div id="comp-level-selector" class="flex justify-center gap-3">
                <button onclick="startCompetition('easy')" class="btn-3d bg-emerald-500 text-white font-black py-2.5 px-5 rounded-xl text-base border border-emerald-600">初級</button>
                <button onclick="startCompetition('medium')" class="btn-3d bg-blue-500 text-white font-black py-2.5 px-5 rounded-xl text-base border border-blue-600">中級</button>
                <button onclick="startCompetition('hard')" class="btn-3d bg-purple-500 text-white font-black py-2.5 px-5 rounded-xl text-base border border-purple-600">高級</button>
            </div>

            <!-- 三欄式排行榜面板 (初級 / 中級 / 高級) -->
            <div id="comp-leaderboard-panel" class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                <h3 class="text-sm font-black text-slate-700 mb-3 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-trophy text-amber-500"></i> 全站競賽英雄榜 (各等級前 10 名)
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-xs">
                    <!-- 初級榜 -->
                    <div class="bg-white p-2.5 rounded-xl border border-emerald-200 shadow-sm">
                        <div class="font-black text-emerald-700 text-center pb-1.5 mb-1.5 border-b border-emerald-100">🌱 初級英雄榜</div>
                        <div id="leaderboard-easy" class="flex flex-col gap-1 max-h-48 overflow-y-auto">
                            <div class="text-center text-slate-400 py-2">載入中...</div>
                        </div>
                    </div>
                    <!-- 中級榜 -->
                    <div class="bg-white p-2.5 rounded-xl border border-blue-200 shadow-sm">
                        <div class="font-black text-blue-700 text-center pb-1.5 mb-1.5 border-b border-blue-100">🚀 中級英雄榜</div>
                        <div id="leaderboard-medium" class="flex flex-col gap-1 max-h-48 overflow-y-auto">
                            <div class="text-center text-slate-400 py-2">載入中...</div>
                        </div>
                    </div>
                    <!-- 高級榜 -->
                    <div class="bg-white p-2.5 rounded-xl border border-purple-200 shadow-sm">
                        <div class="font-black text-purple-700 text-center pb-1.5 mb-1.5 border-b border-purple-100">👑 高級英雄榜</div>
                        <div id="leaderboard-hard" class="flex flex-col gap-1 max-h-48 overflow-y-auto">
                            <div class="text-center text-slate-400 py-2">載入中...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 競賽專用米字格與提示區域 (開始競賽後顯示) -->
        <div id="comp-play-area" class="hidden flex flex-col items-center gap-3 w-full">
            <!-- 目前得分獨立顯示於訊息列上方 -->
            <div class="w-full flex justify-center">
                <div class="bg-child-orange text-black px-5 py-1.5 rounded-2xl font-black text-base sm:text-lg shadow-md border border-amber-700 tracking-wide flex items-center gap-2">
                    <!-- 競賽雙劍 SVG 圖示 (與競賽分頁主題一致) -->
                    <svg class="w-6 h-6 shrink-0 drop-shadow-sm" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 左上至右下寶劍 -->
                        <path d="M7 7L12 6L26 20L23 23L9 9L7 7Z" fill="#F8FAFC" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M21 25L26 20" stroke="#FFDE59" stroke-width="3" stroke-linecap="round"/>
                        <path d="M24.5 22.5L29 27" stroke="#92400E" stroke-width="2.6" stroke-linecap="round"/>
                        <circle cx="29.5" cy="27.5" r="1.8" fill="#FFDE59" stroke="#92400E" stroke-width="1.2"/>
                        <!-- 右上至左下寶劍 -->
                        <path d="M29 7L24 6L10 20L13 23L27 9L29 7Z" fill="#E2E8F0" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M15 25L10 20" stroke="#FFDE59" stroke-width="3" stroke-linecap="round"/>
                        <path d="M11.5 22.5L7 27" stroke="#92400E" stroke-width="2.6" stroke-linecap="round"/>
                        <circle cx="6.5" cy="27.5" r="1.8" fill="#FFDE59" stroke="#92400E" stroke-width="1.2"/>
                    </svg>
                    <span>目前得分：<span id="comp-score-display">0</span> 分</span>
                </div>
            </div>

            <!-- 說明列 (置中對齊顯示累計錯誤與題目) -->
            <div class="w-full bg-amber-50 border-2 border-amber-400/60 rounded-2xl py-2 px-4 flex items-center justify-center shadow-sm">
                <p id="comp-feedback-text" class="text-sm sm:text-base font-black text-slate-900 tracking-wide text-center w-full">
                    累計錯誤 0 / 3 次 ｜ 準備中...
                </p>
            </div>

            <!-- 米字格畫布 -->
            <div class="relative w-full max-w-[300px] aspect-square flex items-center justify-center my-1">
                <div id="comp-grid-container" class="mi-zi-ge w-full h-full relative overflow-hidden flex items-center justify-center">
                    <div id="comp-character-target" class="w-full h-full flex items-center justify-center"></div>
                </div>
            </div>

            <!-- 專用控制按鈕 (重新開始與結束競賽) -->
            <div class="w-full max-w-[300px] flex gap-2">
                <button onclick="restartCompetition()" class="flex-1 btn-3d bg-child-orange text-black font-black py-2 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-1 border border-orange-600">
                    <i class="fa-solid fa-rotate-right"></i> 重新開始
                </button>
                <button onclick="quitCompetition()" class="flex-1 btn-3d bg-child-green text-black font-black py-2 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-1 border border-slate-600">
                    <i class="fa-solid fa-door-open"></i> 結束競賽
                </button>
            </div>
        </div>
    </div>

    <!-- 4. 我的成就字庫分頁 (隱藏狀態) -->
    <div id="tab-vault-view" class="hidden w-full bg-white p-3 sm:p-5 rounded-3xl shadow-xl border-3 border-slate-100 flex flex-col gap-3 mb-auto">
        <!-- 頂部成就計數卡 -->
        <div class="bg-gradient-to-r from-amber-300 to-yellow-500 p-4 rounded-2xl text-slate-900 shadow-md flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
                <span class="text-lg sm:text-xl font-black text-slate-900">累計捕獲:</span>
                <span id="vault-count" class="text-2xl sm:text-3xl font-black text-rose-600 bg-white/95 px-3 py-0.5 rounded-xl border-2 border-white shadow-[0_3px_8px_rgba(180,83,9,0.35)] drop-shadow-[0_1px_1px_rgba(0,0,0,0.15)]">0</span>
                <span class="text-lg sm:text-xl font-black text-slate-900">個漢字卡牌</span>
            </div>
            <div class="bg-white/85 px-3 py-1.5 rounded-full text-sm sm:text-base font-black text-amber-900 shadow-sm flex items-center gap-1">
                <span>目前等級:</span>
                <span id="vault-badge">漢字小學生 🏅</span>
            </div>
        </div>

        <!-- 固定鼓勵標語區塊 (常駐於橘色橫幅下方) -->
        <div class="bg-amber-50/90 border border-amber-200 rounded-2xl py-2.5 px-3 text-center shadow-sm">
            <p class="text-sm sm:text-base font-black text-slate-800">快到「筆順挑戰」闖關，一起捕獲「漢字卡牌」吧！</p>
            <p class="text-xs sm:text-sm font-bold text-amber-800 mt-0.5">共有10個等級，等你來挑戰</p>
        </div>

        <!-- 已解鎖漢字網格 (於鼓勵文字下方累積排列) -->
        <div id="vault-grid" class="grid grid-cols-5 sm:grid-cols-6 gap-2 max-h-80 overflow-y-auto p-1"></div>
    </div>

    <!-- 頁尾 -->
    <footer class="mt-3 text-center text-xs text-slate-400 font-medium shrink-0">
       🌟Design by LouieLucas Studio🌟
    </footer>

    <!-- JavaScript 核心邏輯 -->
    <script>
        let writer = null;
        let compWriter = null;
        let currentChar = '永';
        let compCurrentChar = '';
        let currentTab = 'practice';
        let strokeSpeed = 1;
        let isPaused = false; // 追蹤筆順動畫暫停狀態
        let isAnimating = false; // 精準追蹤筆順動畫播放狀態

        // 競賽模式 state
        let isCompeting = false;
        let compLevel = 'easy';
        let compScore = 0;
        let compMistakes = 0;
        let compCompletedStrokes = 0;
        let compWordBank = [];
        // 預設斷網備援題庫（啟動後會自動從 Firebase word_banks 同步覆寫）
        let WORD_BANKS = {
            easy: ['人', '大', '小', '木', '口', '日', '月', '山', '水', '火'],
            medium: ['永', '福', '好', '學', '習', '春', '喜', '飛', '花', '愛'],
            hard: ['龍', '龜', '鳳', '聽', '讀', '禮', '藝', '繁', '靈', '慶']
        };

        // 本機與雲端成就字庫 Array
        let unlockedVault = new Set();

        let canvas, ctx;
        let isDrawing = false;
        let brushColor = '#5271FF';
        let brushSize = 12;

        window.showAuthNotice = function(msg) {
            const banner = document.getElementById('auth-notice-banner');
            const textEl = document.getElementById('auth-notice-text');
            if (banner && textEl) {
                textEl.innerText = msg;
                banner.classList.remove('hidden');
            }
        };

        window.resetLocalUserVault = function() {
            unlockedVault.clear();
            if (currentTab === 'vault') renderVaultGrid();
        };

        // 從 Firestore 動態讀取 word_banks 雲端競賽題庫 (easy / medium / hard)
        window.loadCloudWordBanks = async function() {
            if (!window.db || !window.doc || !window.getDoc) return;
            const levels = ['easy', 'medium', 'hard'];
            for (const lvl of levels) {
                try {
                    const bankRef = window.doc(window.db, 'word_banks', lvl);
                    const snap = await window.getDoc(bankRef);
                    if (snap.exists() && Array.isArray(snap.data().words) && snap.data().words.length > 0) {
                        WORD_BANKS[lvl] = snap.data().words.filter(w => typeof w === 'string' && w.trim().length > 0);
                    }
                } catch (e) {
                    console.warn(`讀取雲端題庫 (${lvl}) 失敗，使用備援題庫:`, e);
                }
            }
        };

        window.onload = function () {
            canvas = document.getElementById('user-canvas');
            ctx = canvas.getContext('2d');
            document.getElementById('char-input').value = currentChar;

            resizeCanvas();
            initDrawingListeners();
            loadCharacter(currentChar);

            // 初始化雲端 Auth 與監聽
            if (window.initAuth) window.initAuth();

            window.onUserLogin = function(user) {
                const userDisplay = document.getElementById('user-display');
                const btnLogin = document.getElementById('btn-google-login');
                const btnLogout = document.getElementById('btn-google-logout');
                const isGoogleUser = user && !user.isAnonymous;

                if (userDisplay) {
                    if (isGoogleUser) {
                        const displayName = user.displayName || user.email || 'Google 學員';
                        const avatarHtml = user.photoURL 
                            ? `<img src="${user.photoURL}" alt="avatar" class="w-4 h-4 rounded-full inline-block" onerror="this.style.display='none'">` 
                            : '👤';
                        userDisplay.innerHTML = `${avatarHtml} <span class="max-w-[90px] sm:max-w-[140px] truncate">${displayName}</span>`;
                        userDisplay.className = "text-xs font-bold bg-blue-50 text-child-blue px-2.5 py-1 rounded-full border border-blue-200 flex items-center gap-1.5";
                    } else {
                        userDisplay.innerText = '👤 訪客模式';
                        userDisplay.className = "text-xs font-bold bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full border border-slate-200 flex items-center gap-1";
                    }
                }

                if (btnLogin && btnLogout) {
                    if (isGoogleUser) {
                        btnLogin.classList.add('hidden');
                        btnLogout.classList.remove('hidden');
                    } else {
                        btnLogin.classList.remove('hidden');
                        btnLogout.classList.add('hidden');
                    }
                }

                unlockedVault.clear();
                window.loadCloudWordBanks();
                syncCloudVault();
                listenLeaderboard();
            };
        };

        // 頁籤切換控制
        function switchTab(tabId) {
            currentTab = tabId.replace('tab-', '');
            
            // UI 按鈕切換高亮
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn btn-3d py-3 px-1 rounded-xl font-black text-sm sm:text-base bg-slate-100 text-slate-700 border border-slate-300 flex items-center justify-center gap-1';
            });
            document.getElementById(`nav-${currentTab}`).className = 'tab-btn btn-3d py-3 px-1 rounded-xl font-black text-sm sm:text-base bg-child-blue text-white border border-blue-600 flex items-center justify-center gap-1';

            // 畫面隱藏與顯示
            document.getElementById('main-learning-view').classList.add('hidden');
            document.getElementById('tab-competition-view').classList.add('hidden');
            document.getElementById('tab-vault-view').classList.add('hidden');

            // 離開或重新進入競賽分頁時，一律重置為未開啟米字格的初始狀態
            quitCompetition();

            if (currentTab === 'practice' || currentTab === 'challenge') {
                document.getElementById('main-learning-view').classList.remove('hidden');
                document.getElementById('control-buttons-group').classList.remove('hidden');
                
                const isChallenge = currentTab === 'challenge';
                toggleChallengeUIDisabled(isChallenge);

                updatePromptByInput();
                clearAllContent();
            } else if (currentTab === 'competition') {
                document.getElementById('tab-competition-view').classList.remove('hidden');
            } else if (currentTab === 'vault') {
                document.getElementById('tab-vault-view').classList.remove('hidden');
                renderVaultGrid();
            }
        }

        // 停用/啟用挑戰模式時的功能按鈕與選單
        function toggleChallengeUIDisabled(disabled) {
            const btnFast = document.getElementById('btn-fast');
            const btnSlow = document.getElementById('btn-slow');
            const btnClear = document.getElementById('btn-clear');
            const settingsGroup = document.getElementById('settings-menu-group');
            const colorBtns = document.querySelectorAll('#color-picker-group button');
            const sizeBtns = document.querySelectorAll('#size-picker-group button');

            [btnFast, btnSlow, btnClear].forEach(el => {
                if (el) el.disabled = disabled;
            });

            colorBtns.forEach(btn => {
                btn.disabled = disabled;
                btn.style.pointerEvents = disabled ? 'none' : 'auto';
            });
            sizeBtns.forEach(btn => {
                btn.disabled = disabled;
                btn.style.pointerEvents = disabled ? 'none' : 'auto';
            });

            if (disabled) {
                document.getElementById('control-buttons-group').classList.add('opacity-40', 'pointer-events-none');
                settingsGroup.classList.add('opacity-40', 'pointer-events-none');
            } else {
                document.getElementById('control-buttons-group').classList.remove('opacity-40', 'pointer-events-none');
                settingsGroup.classList.remove('opacity-40', 'pointer-events-none');
            }
        }

        // 載入漢字
        function loadCharacter(char) {
            if (!char) {
                updatePromptByInput();
                return;
            }

            // 檢查是否為標準中文字元
            const isChineseChar = /^[\u4e00-\u9fa5]$/.test(char);
            if (!isChineseChar) {
                updateFeedback('請輸入一個漢字。', 'text-child-pink');
                return;
            }

            currentChar = char;
            clearUserCanvas();
            const container = document.getElementById('character-target');
            container.innerHTML = '';
            writer = null;
            initWriter(char);
            updatePromptByInput();
        }

        function initWriter(char) {
            if (!char) return;
            const container = document.getElementById('character-target');
            container.innerHTML = '';
            const gridWidth = document.getElementById('grid-container').clientWidth;

            try {
                writer = HanziWriter.create('character-target', char, {
                    width: gridWidth,
                    height: gridWidth,
                    padding: 20,
                    strokeAnimationSpeed: strokeSpeed,
                    delayBetweenStrokes: 200,
                    strokeColor: '#2C3E50',
                    outlineColor: '#CBD5E1',
                    showOutline: true,
                    showCharacter: currentTab === 'practice',
                    highlightColor: '#FF66C4',
                    onLoadCharDataError: function(err) {
                        console.warn('HanziWriter 載入失敗:', err);
                        updateFeedback(`⚠️ 抱歉，暫無「${char}」的筆順資料`, 'text-child-orange');
                    },
                    onMistake: function() {
                        if (currentTab === 'challenge') {
                            updateFeedback(' 哎呀! 筆順錯囉，請再試試!', 'text-child-pink');
                        }
                    },
                    onComplete: function() {
                        if (currentTab === 'challenge') {
                            updateFeedback('恭喜你，挑戰成功! 已存入字庫。', 'text-child-blue');
                            saveToVault(currentChar);
                            handleQuizSuccessEffects();
                        }
                    }
                });

                if (currentTab === 'challenge') {
                    writer.quiz();
                    canvas.style.pointerEvents = 'none';
                } else {
                    canvas.style.pointerEvents = 'auto';
                }
            } catch (err) {
                console.warn(err);
                updateFeedback(`⚠️ 載入「${char}」時發生錯誤`, 'text-child-pink');
            }
        }

        // 競賽專用邏輯
        function startCompetition(level) {
            compLevel = level;
            compScore = 0;
            compMistakes = 0;
            compCompletedStrokes = 0;
            isCompeting = true;
            compWordBank = [...WORD_BANKS[level]].sort(() => Math.random() - 0.5);

            updateCompScoreUI();
            document.getElementById('comp-home-section').classList.add('hidden');
            document.getElementById('comp-play-area').classList.remove('hidden');
            nextCompetitionWord();
        }

        function restartCompetition() {
            startCompetition(compLevel);
        }

        function quitCompetition() {
            isCompeting = false;
            compScore = 0;
            compMistakes = 0;
            compCompletedStrokes = 0;
            compCurrentChar = '';
            document.getElementById('comp-play-area').classList.add('hidden');
            document.getElementById('comp-home-section').classList.remove('hidden');
            if (compWriter) {
                document.getElementById('comp-character-target').innerHTML = '';
                compWriter = null;
            }
        }

        function updateCompScoreUI() {
            const scoreEl = document.getElementById('comp-score-display');
            if (scoreEl) scoreEl.innerText = compScore;
        }

        function triggerCompRedFlash() {
            const grid = document.getElementById('comp-grid-container');
            if (!grid) return;
            grid.classList.remove('grid-blink-once');
            void grid.offsetWidth;
            grid.classList.add('grid-blink-once');
            setTimeout(() => {
                grid.classList.remove('grid-blink-once');
            }, 650);
        }

        function nextCompetitionWord() {
            if (compWordBank.length === 0) {
                endCompetition(true);
                return;
            }
            compCompletedStrokes = 0;
            compCurrentChar = compWordBank.pop();
            updateCompFeedback(`累計錯誤 ${compMistakes} / 3 次 ｜ 請寫出「${compCurrentChar}」`);
            initCompWriter(compCurrentChar);
        }

        function initCompWriter(char) {
            const container = document.getElementById('comp-character-target');
            const grid = document.getElementById('comp-grid-container');
            if (grid) grid.classList.remove('grid-blink-once');
            container.innerHTML = '';
            const gridWidth = document.getElementById('comp-grid-container').clientWidth;

            try {
                compWriter = HanziWriter.create('comp-character-target', char, {
                    width: gridWidth,
                    height: gridWidth,
                    padding: 15,
                    strokeAnimationSpeed: 1,
                    delayBetweenStrokes: 200,
                    strokeColor: '#2C3E50',
                    outlineColor: '#CBD5E1',
                    drawingColor: '#333333',
                    drawingWidth: 4,
                    showOutline: true,
                    showCharacter: false,
                    onCorrectStroke: function(strokeData) {
                        compCompletedStrokes = strokeData.strokeNum + 1;
                    },
                    onMistake: function() {
                        if (!isCompeting) return;
                        compMistakes++;
                        triggerCompRedFlash();
                        if (compMistakes >= 3) {
                            endCompetition(false);
                        } else {
                            updateCompFeedback(`累計錯誤 ${compMistakes} / 3 次 ｜ 請寫出「${compCurrentChar}」`);
                        }
                    },
                    onComplete: function() {
                        if (!isCompeting) return;
                        compScore++;
                        updateCompScoreUI();
                        nextCompetitionWord();
                    }
                });
                compWriter.quiz();
            } catch (e) {
                console.warn('競賽 HanziWriter 載入錯誤:', e);
            }
        }

        function renderCompMistakeResult() {
            const container = document.getElementById('comp-character-target');
            if (!container || !compCurrentChar) return;
            const completedCount = compCompletedStrokes;
            const gridWidth = document.getElementById('comp-grid-container').clientWidth;
            container.innerHTML = '';

            // 載入字形筆畫資料，將已完成筆畫渲染為黑色，未完成筆畫渲染為紅色
            HanziWriter.loadCharacterData(compCurrentChar).then(charData => {
                if (!charData || !charData.strokes) return;
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('width', gridWidth);
                svg.setAttribute('height', gridWidth);

                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                const transformData = HanziWriter.getScalingTransform(gridWidth, gridWidth, 15);
                group.setAttribute('transform', transformData.transform);

                charData.strokes.forEach((strokePath, idx) => {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', strokePath);
                    path.setAttribute('fill', idx < completedCount ? '#2C3E50' : '#E53E3E');
                    group.appendChild(path);
                });

                svg.appendChild(group);
                container.appendChild(svg);
            }).catch(err => console.warn('載入錯誤結果筆畫失敗:', err));
        }

        function endCompetition(isAllClear) {
            isCompeting = false;
            if (compWriter) {
                compWriter.cancelQuiz();
            }
            if (!isAllClear) {
                renderCompMistakeResult();
            }
            const msg = isAllClear 
                ? `🔥 完全破關！累計錯誤 ${compMistakes} 次`
                : `💥 累計錯誤 3 次，競賽結束！`;
            
            updateCompFeedback(msg);
            saveScoreToCloud(compScore, compLevel);
        }

        function updateCompFeedback(text) {
            const fbText = document.getElementById('comp-feedback-text');
            if (fbText) fbText.innerText = text;
        }

        // 成就字庫儲存與同步
        async function saveToVault(char) {
            unlockedVault.add(char);
            if (window.currentUser && window.db) {
                try {
                    const userRef = window.doc(window.db, 'artifacts', window.appId, 'users', window.currentUser.uid, 'vault');
                    await window.setDoc(userRef, {
                        unlocked: Array.from(unlockedVault)
                    }, { merge: true });
                } catch(e) {
                    console.log('Vault save error:', e);
                }
            }
        }

        async function syncCloudVault() {
            if (window.currentUser && window.db) {
                try {
                    const userRef = window.doc(window.db, 'artifacts', window.appId, 'users', window.currentUser.uid, 'vault');
                    const snap = await window.getDoc(userRef);
                    if (snap.exists() && snap.data().unlocked) {
                        snap.data().unlocked.forEach(c => unlockedVault.add(c));
                    }
                    if (currentTab === 'vault') renderVaultGrid();
                } catch(e) {}
            }
        }

        async function saveScoreToCloud(score, level) {
            if (window.currentUser && window.db) {
                try {
                    const docId = `${window.currentUser.uid}_${level}`;
                    const leaderRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'leaderboard', docId);
                    const snap = await window.getDoc(leaderRef);
                    const prevScore = snap.exists() ? (snap.data().score || 0) : 0;
                    if (score >= prevScore) {
                        await window.setDoc(leaderRef, {
                            uid: window.currentUser.uid,
                            name: window.currentUser.displayName || window.currentUser.email || '學童玩家',
                            score: score,
                            level: level,
                            updatedAt: Date.now()
                        }, { merge: true });
                    }
                } catch(e) {}
            }
        }

        function listenLeaderboard() {
            if (!window.db) return;
            try {
                const colRef = window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'leaderboard');
                window.onSnapshot(colRef, (snapshot) => {
                    let allList = [];
                    snapshot.forEach(doc => allList.push(doc.data()));
                    ['easy', 'medium', 'hard'].forEach(lvl => {
                        const filtered = allList
                            .filter(item => (item.level || 'easy') === lvl)
                            .sort((a, b) => b.score - a.score)
                            .slice(0, 10);
                        renderLevelLeaderboard(`leaderboard-${lvl}`, filtered);
                    });
                }, (err) => console.warn('Leaderboard snapshot error:', err));
            } catch(e) {}
        }

        function renderLevelLeaderboard(containerId, data) {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 py-3">尚無紀錄</div>';
                return;
            }
            container.innerHTML = data.map((item, index) => `
                <div class="flex items-center justify-between p-1.5 bg-slate-50 rounded-lg border border-slate-100">
                    <span class="font-black text-slate-600 w-5">#${index + 1}</span>
                    <span class="font-bold text-slate-800 flex-1 truncate px-1">${item.name}</span>
                    <span class="font-black text-child-pink shrink-0">${item.score} 分</span>
                </div>
            `).join('');
        }

        function renderVaultGrid() {
            const grid = document.getElementById('vault-grid');
            const arr = Array.from(unlockedVault);
            document.getElementById('vault-count').innerText = arr.length;
            
            const badge = document.getElementById('vault-badge');
            if (arr.length >= 500) badge.innerText = '漢字大宗師 👑';
            else if (arr.length >= 300) badge.innerText = '漢字小博士 🎓';
            else if (arr.length >= 200) badge.innerText = '漢字小達人 🌟';
            else if (arr.length >= 100) badge.innerText = '漢字小達人 ⭐';
            else badge.innerText = '漢字小學生 🏅';

            if (arr.length === 0) {
                grid.innerHTML = '';
                return;
            }

            grid.innerHTML = arr.map(char => `
                <div onclick="previewVaultChar('${char}')" class="btn-3d bg-amber-50 p-1 rounded-xl border-2 border-amber-300 aspect-square flex items-center justify-center cursor-pointer hover:bg-amber-100">
                    <div class="vault-brush-font text-3xl sm:text-4xl text-slate-900 select-none">${char}</div>
                </div>
            `).join('');
        }

        function previewVaultChar(char) {
            switchTab('tab-practice');
            document.getElementById('char-input').value = char;
            loadCharacter(char);
        }

        function handleInputChar(val) {
            const trimmed = val.trim();
            if (trimmed.length > 0) {
                const char = trimmed.charAt(trimmed.length - 1);
                loadCharacter(char);
            } else {
                updatePromptByInput();
            }
        }

        function updatePromptByInput() {
            const val = document.getElementById('char-input').value.trim();
            const isChinese = /^[\u4e00-\u9fa5]$/.test(val);

            if (!val || !isChinese) {
                updateFeedback('請輸入一個漢字。');
            } else {
                if (currentTab === 'practice') {
                    updateFeedback('請點擊「跟寫」或「示範」練習筆順喔!');
                } else if (currentTab === 'challenge') {
                    updateFeedback('請開始筆順挑戰吧!');
                }
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('grid-container');
            if (!container || !canvas) return;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            clearUserCanvas();
        }

        function clearAllContent() {
            currentChar = '';
            document.getElementById('char-input').value = '';
            document.getElementById('character-target').innerHTML = '';
            clearUserCanvas();
            writer = null;
            updatePromptByInput();
        }

        function resizeCanvas() {
            const container = document.getElementById('grid-container');
            if (!container || !canvas) return;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            clearUserCanvas();
        }

        function animateCharacter() {
            if (!writer) return;
            isPaused = false;
            isAnimating = true;
            updateSpeedBtnIcons();
            writer.animateCharacter({ 
                onComplete: () => {
                    isPaused = false;
                    isAnimating = false;
                    updateSpeedBtnIcons();
                    speakCharacter(); // 筆順播放完畢後自動發音一次
                } 
            });
        }

        // 整合點擊「慢寫」與「快寫」按鈕的播放與暫停邏輯
        function toggleSpeedPlay(speed) {
            if (!writer) return;

            const isSameSpeed = (strokeSpeed === speed);

            // 狀況 1: 若點擊同一個速度按鈕且目前正在播放中 -> 暫停播放
            if (isSameSpeed && isAnimating && !isPaused) {
                writer.pauseAnimation();
                isPaused = true;
                isAnimating = false;
                updateSpeedBtnIcons();
                return;
            }

            // 狀況 2: 若點擊同一個速度按鈕且目前處於暫停狀態 -> 繼續播放
            if (isSameSpeed && isPaused) {
                writer.resumeAnimation();
                isPaused = false;
                isAnimating = true;
                updateSpeedBtnIcons();
                return;
            }

            // 狀況 3: 切換不同速度或未播放狀態 -> 載入並開始新速度播放
            strokeSpeed = speed;
            isPaused = false;
            if (currentChar) {
                loadCharacter(currentChar);
                setTimeout(() => {
                    animateCharacter();
                }, 100);
            }
        }

        // 更新慢寫與快寫按鈕的播放/暫停圖示 (▶ / ❚❚)
        function updateSpeedBtnIcons() {
            const iconSlow = document.getElementById('icon-slow');
            const iconFast = document.getElementById('icon-fast');

            if (!iconSlow || !iconFast) return;

            // 先全部還原為播放圖示 (▶)
            iconSlow.className = 'fa-solid fa-play text-xs';
            iconFast.className = 'fa-solid fa-play text-xs';

            // 若目前正在播放中，將當前速度的按鈕切換為暫停圖示 (❚❚)
            if (isAnimating && !isPaused) {
                if (strokeSpeed === 0.4) {
                    iconSlow.className = 'fa-solid fa-pause text-xs';
                } else if (strokeSpeed === 1) {
                    iconFast.className = 'fa-solid fa-pause text-xs';
                }
            }
        }

        function initDrawingListeners() {
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDraw = (e) => {
                if (currentTab !== 'practice') return;
                isDrawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                ctx.strokeStyle = brushColor;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            };

            const draw = (e) => {
                if (!isDrawing || currentTab !== 'practice') return;
                if (e.cancelable) e.preventDefault();
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDraw = () => { 
                if (isDrawing) {
                    ctx.closePath();
                    isDrawing = false; 
                }
            };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);

            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDraw);
            canvas.addEventListener('touchcancel', stopDraw);
        }

        function setBrushColor(color, btnEl) {
            brushColor = color;
            document.querySelectorAll('#color-picker-group .color-btn').forEach(b => b.classList.remove('ring-2', 'ring-slate-900'));
            if (btnEl) btnEl.classList.add('ring-2', 'ring-slate-900');
        }

        function setBrushSize(size, btnEl) {
            brushSize = size;
            document.querySelectorAll('#size-picker-group .size-btn').forEach(b => b.classList.remove('ring-2', 'ring-slate-900'));
            if (btnEl) btnEl.classList.add('ring-2', 'ring-slate-900');
        }

        function clearUserCanvas() {
            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function speakCharacter() {
            const char = currentChar || document.getElementById('char-input').value.trim() || '永';
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止先前發音
                const utterance = new SpeechSynthesisUtterance(char);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.75; // 稍微放慢速度適合兒童聽讀
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateFeedback(text, colorClass = 'text-child-blue') {
            const fbText = document.getElementById('feedback-text');
            if (fbText) {
                fbText.innerText = text;
                fbText.className = `text-sm sm:text-base font-black tracking-wide ${colorClass}`;
            }
        }

        function handleQuizSuccessEffects() {
            // 慶祝效果 (粒子動畫)
            const target = document.getElementById('grid-container');
            if (!target) return;
            const colors = ['#FFDE59', '#FF4aba', '#415acc', '#1bd2b2', '#FF914D'];
            for (let i = 0; i < 24; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti-particle';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = '50%';
                particle.style.top = '50%';
                particle.style.width = `${Math.random() * 8 + 6}px`;
                particle.style.height = `${Math.random() * 8 + 6}px`;
                const tx = (Math.random() - 0.5) * 260;
                const ty = (Math.random() - 0.5) * 260;
                const rot = Math.random() * 360;
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.setProperty('--rot', `${rot}deg`);
                target.appendChild(particle);
                setTimeout(() => particle.remove(), 1200);
            }
            speakCharacter();
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });
    </script>
</body>
</html>
